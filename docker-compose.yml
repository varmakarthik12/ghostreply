version: "3.9"
services:
  ghostreply:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GHOSTREPLY_TOKEN=${GHOSTREPLY_TOKEN}
      - GHOSTREPLY_DB_PATH=/data/ghostreply.db
      - GHOSTREPLY_OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - ghostreply_data:/data
    restart: unless-stopped
volumes:
  ghostreply_data:
